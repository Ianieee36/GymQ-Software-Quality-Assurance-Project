# GymQ continuous integration
#
# Stages (each is a quality gate; a later stage only runs if the earlier ones pass):
#   1. build         compile the whole solution once, in Release
#   2. core-tests    unit, integration and persistence tests, with code coverage
#   3. ui-tests      headless Avalonia UI tests, isolated because they are slower and can hang
#   4. publish       on main only: package the desktop app for download (release candidate)
# Side job:
#   dependency-audit  reports known-vulnerable NuGet packages (warning, does not block)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: GymQ.slnx
  TEST_PROJECT: tests/GymQ.Tests/GymQ.Tests.csproj
  # Tests must never touch a developer's real save file.
  GYMQ_DATA_PATH: ${{ github.workspace }}/.ci-data/gym-state.json

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Core and Desktop target .NET 8; the test project targets .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Build
        run: dotnet build $SOLUTION --no-restore --configuration Release

  core-tests:
    name: Core tests + coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build $SOLUTION --configuration Release

      # Smoke gate: the cross-module flows fail fast before the full run.
      - name: Smoke tests
        run: >
          dotnet test $TEST_PROJECT --no-build --configuration Release
          --filter "FullyQualifiedName~CrossModuleIntegrationTests"

      - name: Unit, integration and persistence tests
        run: >
          dotnet test $TEST_PROJECT --no-build --configuration Release
          --filter "TestCategory!=UI"
          --logger "trx;LogFileName=core.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:coverage \
            -reporttypes:"Html;MarkdownSummaryGithub" \
            -classfilters:"-GymQ.Desktop.Views.*;-*.Properties.*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload core test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-evidence
          path: |
            TestResults/**/*.trx
            coverage
          if-no-files-found: warn

  ui-tests:
    name: Headless UI tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build $SOLUTION --configuration Release

      # The blame hang timeout kills a stuck headless session and names the test that hung.
      - name: UI tests
        env:
          GYMQ_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: >
          dotnet test $TEST_PROJECT --no-build --configuration Release
          --filter "TestCategory=UI"
          --logger "trx;LogFileName=ui.trx"
          --results-directory TestResults
          --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence
          path: |
            TestResults/**/*.trx
            screenshots
          if-no-files-found: warn

  dependency-audit:
    name: Vulnerable package audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported, not blocking: a vulnerable transitive package is a finding to triage,
    # not a reason to stop every merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore $SOLUTION
      - name: List vulnerable packages
        run: |
          dotnet list $SOLUTION package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::warning::Vulnerable NuGet packages found. See the job log."
            exit 1
          fi

  publish:
    name: Package desktop app
    needs: [core-tests, ui-tests]
    # Release candidates come only from main, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rid: [win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: >
          dotnet publish src/GymQ.Desktop/GymQ.Desktop.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true
          --output publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: GymQ-${{ matrix.rid }}-${{ github.sha }}
          path: publish/${{ matrix.rid }}
          retention-days: 14